[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "talabiytak-product-images"
version = "1.0.0"
description = "Arabic ImageKit-backed product image manager"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "jinja2>=3.1", "sqlalchemy>=2.0", "alembic>=1.13", "pydantic-settings>=2.4", "python-multipart>=0.0.9", "pillow>=10.4", "imagekitio==4.2.0", "itsdangerous>=2.2", "httpx>=0.27", "typer>=0.12"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

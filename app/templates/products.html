{% extends 'base.html' %}{% block content %}<div class="title-row"><h1>المنتجات</h1><a class="button" href="/products/new">إضافة منتج</a></div><form class="search"><input name="q" value="{{ q }}" placeholder="ابحث بالاسم العربي"><button>بحث</button></form><div class="grid">{% for p in products %}<article class="card"><img src="{{ p.image_url }}" alt="{{ p.name }}"><h3>{{ p.name }}</h3><small>{{ p.created_at.strftime('%Y-%m-%d') }}</small><a class="button secondary" href="/products/{{ p.id }}/edit">تعديل</a></article>{% else %}<div class="empty">لا توجد منتجات مطابقة.</div>{% endfor %}</div><div class="pagination">{% for n in range(1,pages+1) %}<a href="?q={{ q|urlencode }}&page={{ n }}">{{ n }}</a>{% endfor %}</div>{% endblock %}

{% extends 'base.html' %}{% block content %}<h1>{{ 'تعديل الطلبية' if order else 'إنشاء طلبية جديدة' }}</h1><div class="order-notification" data-order-notification role="alert" aria-live="assertive" hidden></div><form class="card order-editor" method="post" data-order-editor><input type="hidden" name="csrf_token" value="{{ session.csrf }}"><label>اسم الطلبية<input name="title" maxlength="150" required value="{{ order.title if order else '' }}"></label><section><h2>البحث عن المنتجات</h2><div class="search"><input type="search" data-product-query placeholder="اكتب اسم المنتج"><button type="button" data-product-search>بحث</button></div><div class="grid compact" data-search-results></div></section><section><h2>المنتجات المختارة</h2><div class="selected-products-list" data-selected-products>{% if order %}{% for item in order.items %}<article class="selected-product card" data-product-id="{{ item.product_id }}"><input type="hidden" name="product_id" value="{{ item.product_id }}"><strong>{{ item.product_name }}</strong><label>الكمية<input type="number" name="quantity" min="1" max="1000000" required value="{{ item.quantity }}"></label><div class="actions"><button type="button" class="secondary" data-move-up>↑</button><button type="button" class="secondary" data-move-down>↓</button><button type="button" class="danger" data-remove>إزالة</button></div></article>{% endfor %}{% endif %}</div><p data-empty-selection>لم تضف منتجات بعد.</p></section><button>حفظ الطلبية</button></form><script src="{{ url_for('static',path='/orders.js') }}?v={{ asset_version('orders.js') }}" defer></script>{% endblock %}
